repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: agent-docs-check
        name: Agent docs in sync (website /agents pages)
        description: Fail the commit if website/src/content/agents/*.md are
          stale relative to the profile modules' docstrings and
          situations.json. Fix by running `make agents-docs` and staging
          the regenerated markdown, then commit again. Check-only on
          purpose so the hook never rewrites the working tree mid-commit.
        entry: make agents-docs-check
        language: system
        pass_filenames: false
        files: (^code/behavioural-simulations/profiles/.*(/situations\.json|/__init__\.py)$|^website/(scripts/generate_agent_docs\.py|src/content/agents/.*)$)
        verbose: false

      - id: build-latex-pdfs
        name: Build LaTeX PDFs
        description: Rebuild out-of-date PDFs from .tex/.bib sources
        entry: make
        language: system
        pass_filenames: false
        files: ^docs/.*\.(tex|bib)$

      - id: marimo-check
        name: marimo check
        entry: uv run marimo check --ignore-scripts
        language: system
        types: [python]

      - id: sync-hf-artifacts
        name: Sync artifacts to HF bucket (+ optional borg backup)
        description: Upload artifacts/ to the HF storage bucket, then borg
          backup when RUN_BORG_BACKUP=true. Best-effort (warnings never block
          the commit). Configure via .env; see .env.example.
        entry: make artifacts-precommit
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --scopes
          - report,misc,website,survey,dataset,fine-tune,simulation,
          - docs
          - code
          - dev
